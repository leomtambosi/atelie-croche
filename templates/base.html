<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ateliê de Crochê - Pontos de Amor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Cabeçalho -->
    <header class="header">
        <div class="container text-center">
            <a href="/" class="logo-link">
                <div class="logo-badge">🧵 ATELIÊ</div>
                <h1 class="logo-title">Pontos de Amor</h1>
                <p class="logo-subtitle">Peças artesanais feitas à mão com carinho</p>
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="footer">
        <div class="container text-center">
            <p>© 2026 Ateliê de Crochê - Todos os direitos reservados.</p>
            <p class="footer-love">Feito à mão com afeto ❤️</p>
            
            <!-- Link discreto para o Painel da Artesã -->
            <div style="margin-top: 15px;">
                <a href="{{ url_for('admin_login') }}" style="font-size: 0.8rem; color: var(--primary); text-decoration: none; opacity: 0.8;">
                    🔒 Acesso do Vendedor / Painel
                </a>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
